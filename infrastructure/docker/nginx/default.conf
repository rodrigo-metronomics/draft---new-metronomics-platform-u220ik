# Metronomics Platform - Nginx Configuration for Docker
# This configuration serves the React frontend application and proxies API requests to the backend

# Global HTTP directives
client_max_body_size 10M;  # Limit file upload size to 10MB
server_tokens off;  # Hide Nginx version information for security
gzip on;  # Enable gzip compression for faster loading
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;  # MIME types to compress
gzip_comp_level 6;  # Compression level (1-9)
gzip_min_length 1000;  # Minimum length of response to compress
gzip_proxied any;  # Compress responses for proxied requests

server {
    listen 80;
    server_name _;  # Accept requests to any server name
    root /usr/share/nginx/html;  # Root directory for static files
    index index.html;  # Default index file

    # Security headers to protect against common web vulnerabilities
    add_header X-Content-Type-Options nosniff;  # Prevent MIME type sniffing
    add_header X-Frame-Options SAMEORIGIN;  # Prevent clickjacking attacks
    add_header X-XSS-Protection "1; mode=block";  # Enable XSS filtering
    add_header Referrer-Policy strict-origin-when-cross-origin;  # Control referrer information
    # Content Security Policy to restrict resource loading and prevent XSS
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://*.firebaseio.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; img-src 'self' data: https://*.googleapis.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://*.firebaseauth.com;";

    # Serve static files and handle SPA routing
    # For any path, first try to find the exact file, then try with trailing slash,
    # and finally fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-cache';  # Prevent caching for dynamic HTML content
    }

    # Proxy API requests to the backend service
    location /api {
        proxy_pass http://backend:3000;  # Forward requests to backend service
        proxy_http_version 1.1;  # Use HTTP/1.1 for proxying
        proxy_set_header Upgrade $http_upgrade;  # Support WebSocket connections
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;  # Pass original host header
        proxy_set_header X-Real-IP $remote_addr;  # Pass client IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Pass client IP in forwarded header
        proxy_set_header X-Forwarded-Proto $scheme;  # Pass original protocol (http/https)
        proxy_cache_bypass $http_upgrade;  # Bypass cache for WebSocket connections
        proxy_read_timeout 90;  # Timeout for reading a response from the proxied server
    }

    # Serve static assets with long-term caching
    # These are typically hash-named files that can be cached indefinitely
    location /static {
        expires 1y;  # Set expires header far in the future
        add_header Cache-Control 'public, immutable';  # Tell browsers this content never changes
    }

    # Serve asset files with long-term caching
    location /assets {
        expires 1y;
        add_header Cache-Control 'public, immutable';
    }

    # Health check endpoint for container orchestration
    # Used by Docker/Kubernetes to verify the container is healthy
    location /health {
        access_log off;  # Don't log health check requests
        return 200 'healthy';  # Simply return a 200 OK with "healthy" text
    }
}