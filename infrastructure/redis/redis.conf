# Redis configuration for Metronomics Platform
# This configuration is optimized for caching, session management, and rate limiting
################################################################################

################################################################################
# Network configuration
################################################################################
# Accept connections on the specified port
port 6379

# Listen on all available network interfaces
bind 0.0.0.0

# Require clients to authenticate before processing any command
protected-mode yes

# TCP listen backlog size
tcp-backlog 511

# Client timeout in seconds (0 = disable)
timeout 0

# TCP keepalive interval in seconds
tcp-keepalive 300

################################################################################
# General configuration
################################################################################
# Run Redis as a daemon (set to 'no' for containerized environments)
daemonize no

# Supervision method (systemd, upstart, auto, no)
supervised no

# Path to the PID file
pidfile /var/run/redis_6379.pid

# Log level (debug, verbose, notice, warning)
loglevel notice

# Log to stdout for containerized environments
logfile ""

# Number of Redis databases
databases 16

################################################################################
# Memory management configuration
################################################################################
# Maximum memory limit for Redis (adjust based on environment)
maxmemory 256mb

# Eviction policy when memory limit is reached (remove least recently used keys with expiration)
maxmemory-policy volatile-lru

# Number of samples to check for LRU eviction
maxmemory-samples 5

# Replicas don't enforce maxmemory as they are exact copies of the primary
replica-ignore-maxmemory yes

################################################################################
# Persistence configuration
################################################################################
# Save DB if 1 key changes in 900 seconds (15 minutes)
save 900 1

# Save DB if 10 keys change in 300 seconds (5 minutes)
save 300 10

# Save DB if 10000 keys change in 60 seconds (1 minute)
save 60 10000

# Stop accepting writes if RDB snapshots are failing
stop-writes-on-bgsave-error yes

# Compress RDB files
rdbcompression yes

# Use CRC64 checksums in RDB files
rdbchecksum yes

# Filename for the RDB file
dbfilename dump.rdb

# Directory for RDB and AOF files
dir /data

################################################################################
# Replication settings
################################################################################
# Replicas serve stale data when disconnected from master
replica-serve-stale-data yes

# Replicas are read-only
replica-read-only yes

# Use diskless replication (more efficient for containers)
repl-diskless-sync yes

# Wait 5 seconds before starting diskless replication
repl-diskless-sync-delay 5

# Replication timeout in seconds
repl-timeout 60

################################################################################
# Security configuration
################################################################################
# Require password authentication (set via environment variable)
requirepass ${REDIS_PASSWORD}

# Disable FLUSHDB command for security
rename-command FLUSHDB ""

# Disable FLUSHALL command for security
rename-command FLUSHALL ""

# Disable CONFIG command for security
rename-command CONFIG ""

################################################################################
# Client settings
################################################################################
# Maximum number of connected clients
maxclients 10000

################################################################################
# Append only mode settings
################################################################################
# Disable AOF persistence (using RDB snapshots instead)
appendonly no

# Filename for the AOF file
appendfilename appendonly.aof

# Fsync policy (always, everysec, no)
appendfsync everysec

# Don't fsync if a rewrite is in progress
no-appendfsync-on-rewrite no

# Rewrite AOF if size increases by this percentage
auto-aof-rewrite-percentage 100

# Minimum size for AOF rewrite
auto-aof-rewrite-min-size 64mb

################################################################################
# Lua scripting settings
################################################################################
# Maximum execution time for Lua scripts in milliseconds
lua-time-limit 5000

################################################################################
# Slow log settings
################################################################################
# Log queries slower than this many microseconds
slowlog-log-slower-than 10000

# Maximum length of the slow log
slowlog-max-len 128

################################################################################
# Latency monitoring settings
################################################################################
# Latency monitoring threshold in milliseconds (0 = disabled)
latency-monitor-threshold 0

################################################################################
# Event notification settings
################################################################################
# Enable keyspace events for expired keys
notify-keyspace-events Ex

################################################################################
# Performance tuning
################################################################################
# Use ziplist encoding for hashes with small entries
hash-max-ziplist-entries 512

# Use ziplist encoding for hashes with small values
hash-max-ziplist-value 64

# Compress depth for list nodes
list-max-ziplist-size -2

# Compress depth for list nodes
list-compress-depth 0

# Use intset encoding for sets with integer members
set-max-intset-entries 512

# Use ziplist encoding for sorted sets with small entries
zset-max-ziplist-entries 128

# Use ziplist encoding for sorted sets with small values
zset-max-ziplist-value 64

# Enable active rehashing for better memory usage
activerehashing yes

# Output buffer limits for normal clients
client-output-buffer-limit normal 0 0 0

# Output buffer limits for replica clients
client-output-buffer-limit replica 256mb 64mb 60

# Output buffer limits for pubsub clients
client-output-buffer-limit pubsub 32mb 8mb 60

# Redis background task execution frequency
hz 10

# Adapt hz to the number of clients connected
dynamic-hz yes

# Incrementally fsync AOF rewrites
aof-rewrite-incremental-fsync yes

# Incrementally fsync RDB saves
rdb-save-incremental-fsync yes