name: Dependency Security Scan

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight
  push:
    branches:
      - main
    paths:
      - 'src/backend/package.json'
      - 'src/backend/package-lock.json'
      - 'src/web/package.json'
      - 'src/web/package-lock.json'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/backend/package.json'
      - 'src/backend/package-lock.json'
      - 'src/web/package.json'
      - 'src/web/package-lock.json'
  workflow_dispatch:  # Allow manual triggering

env:
  NODE_VERSION: '18'

jobs:
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, web]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/${{ matrix.project }}/package-lock.json
      
      - name: Run npm audit
        working-directory: src/${{ matrix.project }}
        run: npm audit --json > npm-audit-report.json || true
      
      - name: Upload npm audit report
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.project }}-npm-audit-report
          path: src/${{ matrix.project }}/npm-audit-report.json
          retention-days: 7

  snyk-scan:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, web]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/${{ matrix.project }}/package-lock.json
      
      - name: Install dependencies
        working-directory: src/${{ matrix.project }}
        run: npm ci
      
      - name: Install Snyk CLI
        run: npm install -g snyk
      
      - name: Run Snyk to check for vulnerabilities
        working-directory: src/${{ matrix.project }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --json > snyk-report.json || true
      
      - name: Generate SARIF file from Snyk JSON
        working-directory: src/${{ matrix.project }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --sarif > snyk-report.sarif || true
      
      - name: Upload Snyk JSON report
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.project }}-snyk-report
          path: src/${{ matrix.project }}/snyk-report.json
          retention-days: 7
      
      - name: Upload Snyk SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: src/${{ matrix.project }}/snyk-report.sarif
          category: ${{ matrix.project }}-dependencies

  docker-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [backend, web]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: infrastructure/docker/Dockerfile.${{ matrix.dockerfile }}
          push: false
          tags: metronomics-${{ matrix.dockerfile }}:scan
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FIREBASE_API_KEY=test
            FIREBASE_AUTH_DOMAIN=test
            FIREBASE_PROJECT_ID=test
            FIREBASE_STORAGE_BUCKET=test
            FIREBASE_MESSAGING_SENDER_ID=test
            FIREBASE_APP_ID=test
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: metronomics-${{ matrix.dockerfile }}:scan
          format: sarif
          output: trivy-results-${{ matrix.dockerfile }}.sarif
          severity: CRITICAL,HIGH
      
      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-results-${{ matrix.dockerfile }}.sarif
          category: docker-${{ matrix.dockerfile }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: critical
          deny-licenses: GPL-3.0, AGPL-3.0

  generate-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [npm-audit, snyk-scan, docker-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: reports
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Generate consolidated report
        run: node scripts/generate-security-report.js
        continue-on-error: true
      
      - name: Upload consolidated report
        uses: actions/upload-artifact@v3
        with:
          name: consolidated-security-report
          path: security-report.md
          retention-days: 30

  notify-vulnerabilities:
    name: Notify Critical Vulnerabilities
    runs-on: ubuntu-latest
    needs: [generate-report]
    if: github.event_name != 'pull_request'
    steps:
      - name: Download consolidated report
        uses: actions/download-artifact@v3
        with:
          name: consolidated-security-report
      
      - name: Check for critical vulnerabilities
        id: check-critical
        run: grep -q 'CRITICAL' security-report.md && echo "has_critical=true" >> $GITHUB_OUTPUT || echo "has_critical=false" >> $GITHUB_OUTPUT
      
      - name: Create GitHub issue for critical vulnerabilities
        if: steps.check-critical.outputs.has_critical == 'true'
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: .github/ISSUE_TEMPLATE/security_alert.md
          update_existing: true
          search_existing: open